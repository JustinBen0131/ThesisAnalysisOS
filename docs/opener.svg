<text x="28" y="37.1" textLength="117" fill="#7d8f86">$ ./taos demo</text>
<text x="217" y="97.1" textLength="144" fill="#ffffff" font-weight="700">ThesisAnalysisOS</text>
<text x="370" y="97.1" textLength="45" fill="#7d8f86">1.1.0</text>
<text x="559" y="97.1" textLength="162" fill="#7d8f86">whatstillholds.com</text>
<text x="217" y="117.1" textLength="387" fill="#dbe7e0">Every result is kept with what it stood on.</text>
<text x="217" y="137.1" textLength="117" fill="#dbe7e0">Ask it later:</text>
<text x="343" y="137.1" textLength="45" fill="#6fd3a0">holds</text>
<text x="388" y="137.1" textLength="9" fill="#dbe7e0">,</text>
<text x="406" y="137.1" textLength="45" fill="#f2a23a">stale</text>
<text x="451" y="137.1" textLength="9" fill="#dbe7e0">,</text>
<text x="469" y="137.1" textLength="45" fill="#ef8f80">fails</text>
<text x="523" y="137.1" textLength="18" fill="#dbe7e0">or</text>
<text x="550" y="137.1" textLength="63" fill="#7d8f86">unknown</text>
<text x="613" y="137.1" textLength="90" fill="#dbe7e0">, and why.</text>
