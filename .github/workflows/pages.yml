name: site

# A manual release uses the same tests, build, and artifact as an automatic main push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'JustinBen0131/ThesisAnalysisOS' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/ci.yml
