name: selftest

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: taos-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
        exclude:
          # ubuntu-latest is Ubuntu 26.04, which has no Python 3.9 build.
          - os: ubuntu-latest
            python: "3.9"
        include:
          # Keep the Linux 3.9 floor on the newest image that still has one.
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: selftest
        run: python3 taos selftest
      - name: claims
        run: python3 evals/claims.py --strict
      - name: Reproduce the pendulum measurement audit
        if: matrix.python == '3.12'
        run: |
          python3 evals/measurement_audit.py --verify
          python3 evals/review_measurement_audit.py
          python3 evals/check_measurement_boundaries.py
      - name: Reproduce the pendulum handoff audit
        if: matrix.python == '3.12'
        run: |
          python3 evals/handoff_audit.py --verify
          python3 evals/review_handoff_audit.py --self-test
      - name: Reproduce and independently check the instrument comparison
        if: matrix.python == '3.12'
        run: |
          python3 evals/model_evaluation.py --verify
          python3 evals/review_model_evaluation.py --self-test
      - name: Reproduce the research exchange examples
        if: matrix.python == '3.12'
        run: |
          python3 -m unittest evals.test_exchange_simulation evals.test_research_exchange evals.test_release_integrity
          python3 evals/exchange_simulation.py --verify
          python3 evals/replay_instrument_imbalance.py --json > "${RUNNER_TEMP}/instrument-imbalance.json"
          cmp evals/results/followups/instrument-imbalance.json "${RUNNER_TEMP}/instrument-imbalance.json"

  build:
    needs: test
    if: >-
      github.repository == 'JustinBen0131/ThesisAnalysisOS' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: build
        run: python3 site/build.py --release --out _site --ref "$GITHUB_SHA" --url "https://whatstillholds.com/"
      - name: Verify and package the finished site for Pages
        run: |
          python3 site/release_integrity.py _site
          # The source viewer includes reviewed .github paths inside the site.
          tar --hard-dereference -C _site -cf "$RUNNER_TEMP/artifact.tar" .
          mkdir "$RUNNER_TEMP/pages-readback"
          tar -C "$RUNNER_TEMP/pages-readback" -xf "$RUNNER_TEMP/artifact.tar"
          cmp _site/release.json "$RUNNER_TEMP/pages-readback/release.json"
          python3 site/release_integrity.py "$RUNNER_TEMP/pages-readback"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm the tested revision is still main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Main has moved since this revision was tested."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
