name: Research OS workflow feedback
description: Describe one attempt and what you could verify afterward.
title: "[Workflow feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Your answers become a **public GitHub issue** when you submit. Pick one moment when TAOS helped you reuse work, sent you back to check a result, or left you unsure. A small example with invented data is enough. Keep private receipts, project names and credentials in your workspace.

        If you suspect a security problem, use the [private reporting form](https://github.com/JustinBen0131/ThesisAnalysisOS/security/advisories/new).
  - type: dropdown
    id: setting
    attributes:
      label: Where did you try the OS?
      options:
        - Browsing the website
        - Running the bundled example
        - Using one assistant on my own project
        - Using multiple assistants on my own project
        - Working without an assistant
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: What were you trying to do?
      options:
        - Find the evidence behind a result
        - Decide what to rerun after a change
        - Pick up work from another person or assistant
        - Review a compute campaign and its usable outputs
        - Set up or run a check
        - Something else
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: At that step, what happened?
      options:
        - Found earlier work I could safely reuse
        - Caught a result that needed checking again
        - Relied on a result I later found was out of date
        - Repeated work I later found was still usable
        - Had to reconstruct the evidence or ask someone to intervene
        - Finished another kind of task
        - Could not tell whether the result was usable
        - Only explored the site
    validations:
      required: true
  - type: dropdown
    id: verification
    attributes:
      label: How did you check the outcome?
      options:
        - Ran a check or compared the data myself
        - Inspected a source file or saved result
        - Read the assistant's answer
        - Have not checked
        - No result to check
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: What should a fresh assistant do with the same inputs?
      description: Give one step you would keep or change and one result that would show it worked. If you ran your own copy, a public file, software version or saved check helps someone repeat it.
      placeholder: I changed one pendulum reading. I expected the gravity fit to go stale and the independent instrument check to stay usable. I compared the two saved results after the edit.
  - type: input
    id: website-build
    attributes:
      label: Website version
      description: The public site fills this in so the maintainer can reopen the exact version you saw. You can leave it blank.
